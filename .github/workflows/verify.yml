name: verify
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: verify
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Install fixed build tools
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Lint
        run: python -m ruff check src tests/unit packaging/*.py
      - name: Type check
        run: python -m mypy src packaging
      - name: Unit tests
        run: python -m pytest -q
      - name: Build and smoke-test unsigned candidate
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Pinned QA harness and production archive contract
        shell: pwsh
        run: ./packaging/test-archive-contract.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PassiveListener-intermediate-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
